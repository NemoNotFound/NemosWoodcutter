import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly("maven.modrinth:biomes-o-plenty:${biomes_o_plenty_version}-fabric")
    compileOnly("maven.modrinth:terrablender:${terrablender_version}-fabric")
    compileOnly("maven.modrinth:glitchcore:${glitchcore_version}-fabric")
    compileOnly("maven.modrinth:nemos-mossy-blocks:${nemos_mossy_blocks_version}-fabric")
    compileOnly("maven.modrinth:nemos-vertical-slabs:${nemos_vertical_slabs_version}-fabric")
    compileOnly("maven.modrinth:wilder-wild:${wilder_wild_version}-fabric")
    compileOnly("maven.modrinth:frozenlib:${frozenlib_version}-fabric")
    compileOnly("maven.modrinth:better-archeology:${better_archeology_version}-fabric")
    compileOnly("maven.modrinth:architectury-api:${architectury_api_version}+fabric")

    localRuntime("maven.modrinth:wilder-wild:${wilder_wild_version}-fabric")
    localRuntime("maven.modrinth:frozenlib:${frozenlib_version}-fabric")
    localRuntime("maven.modrinth:biomes-o-plenty:${biomes_o_plenty_version}-fabric")
    localRuntime("maven.modrinth:terrablender:${terrablender_version}-fabric")
    localRuntime("maven.modrinth:glitchcore:${glitchcore_version}-fabric")
    localRuntime("maven.modrinth:nemos-mossy-blocks:${nemos_mossy_blocks_version}-fabric")
    localRuntime("maven.modrinth:nemos-vertical-slabs:${nemos_vertical_slabs_version}-fabric")
    localRuntime("maven.modrinth:better-archeology:${better_archeology_version}-fabric")
    localRuntime("maven.modrinth:architectury-api:${architectury_api_version}+fabric")
    localRuntime("maven.modrinth:resourceful-config:${resourceful_config_version}-fabric")
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = project(':common').file('src/generated/resources/')
        modId = project.mod_id
    }
}

processResources { // Conflicts with BOP, so this was done as a work-around
    from(project(':common').file('src/generated-wilder-wild/resources/')) {
        include 'resourcepacks/wilderwild/**'
    }
}

base {
    archivesName = "${mod_id_jar}-Fabric"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        datagenWilderWild { // Conflicts with BOP, so this was done as a work-around
            inherit(getByName('datagen'))
            setConfigName('Fabric Data Generation (Wilder Wild)')
            runDir('run/datagen')
            property('fabric-api.datagen.output-dir', project(':common').file('src/generated-wilder-wild/resources/').absolutePath)
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// These mods register the same two suspicious-stew recipe IDs. Keep them in
// separate data-generation JVMs while retaining a single command for users.
tasks.matching { it.name == 'runDatagen' }.configureEach {
    classpath = files(classpath.filter { file ->
        !file.name.startsWith('wilder-wild')
    })
    dependsOn(tasks.named('runDatagenWilderWild'))
}
tasks.matching { it.name == 'runDatagenWilderWild' }.configureEach {
    classpath = files(classpath.filter { file ->
        !['biomes-o-plenty', 'terrablender', 'glitchcore'].any { file.name.startsWith(it) }
    })
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn(tasks.jar)
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def projectId = findProperty('curseforge_project_id')

    def mainFile = upload(projectId, tasks.jar.archiveFile)
    mainFile.changelog = file('../changelog.md')
    mainFile.displayName = findProperty('mod_name') + ' Fabric ' + findProperty('version')
    mainFile.releaseType = 'release'
    mainFile.addEnvironment("Client", "Server")
    mainFile.addJavaVersion("Java 25")
    mainFile.addRequirement("fabric-api")
    mainFile.addOptional("wilder-wild")
    mainFile.addOptional("better-archeology")
    mainFile.addOptional("biomes-o-plenty")
    mainFile.addOptional("nemos-mossy-blocks")
    mainFile.addOptional("nemos-vertical-slabs")
}

modrinth {
    token.set(System.getenv("MODRINTH_TOKEN"))
    projectId.set(findProperty('modrinth_project_id'))
    changelog.set(file('../changelog.md').text)
    versionName.set(findProperty('mod_name') + ' Fabric ' + findProperty('version'))
    versionType.set("release")
    uploadFile.set(tasks.jar)
    dependencies {
        required.project("fabric-api")
        optional.project("wilder-wild")
        optional.project("better-archeology")
        optional.project("biomes-o-plenty")
        optional.project("nemos-mossy-blocks")
        optional.project("nemos-vertical-slabs")
    }
}
tasks.modrinth.dependsOn(tasks.jar)
